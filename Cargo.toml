# rustuya — a sans-I/O Tuya local-protocol library in pure Rust.
#
# Virtual workspace over the two 0.4 crates:
#   * rustuya-core  — no_std + alloc core (protocol, crypto, Device/Discovery
#                     state machines); driver injects `now` + RNG + sockets.
#   * rustuya-tokio — the std + tokio driver over that core.
#
# The 0.3 line (the monolithic `rustuya` crate + its Python bindings) lives on
# `master` and the v0.3.x tags; 0.4 is a pure-Rust redesign — see MILESTONES.md.
[workspace]
resolver = "2"
members = ["rustuya-core", "rustuya-tokio"]
