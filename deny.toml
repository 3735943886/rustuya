# cargo-deny configuration — see https://embarkstudios.github.io/cargo-deny/
#
# Wired into CI by .github/workflows/ci.yml as a non-blocking signal so a
# newly-published RUSTSEC advisory doesn't break unrelated PRs the moment it
# lands. Treat failures here as "someone should look" rather than "this PR
# is broken".

[graph]
all-features = true
no-default-features = false

[advisories]
yanked = "warn"
ignore = []
# RustSec advisory database is the default source.

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
# Document explicit exceptions here if a duplicate version becomes unavoidable.
skip = []
skip-tree = []

[licenses]
# rustuya itself is MIT. The crate graph should be MIT/Apache-compatible.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "0BSD",
]
confidence-threshold = 0.8

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
