[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "rustuya"
dynamic = ["version"]
readme = "README.md"
description = "A fast and concurrent Tuya Local API implementation in Rust"
authors = [
    { name = "3735943886" }
]
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["tuya", "iot", "smart-home", "automation"]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/3735943886/rustuya"
Repository = "https://github.com/3735943886/rustuya"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "rustuya"

[tool.pytest.ini_options]
markers = [
    "fleet: large-scale concurrent-connection test (heavy; mocks split across processes)",
    "slow: exercises rustuya's ~16s reconnect backoff floor end-to-end (drop -> reconnect -> recover); minutes-scale, run separately",
]
